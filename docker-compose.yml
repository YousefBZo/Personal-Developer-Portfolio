services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: portfolio-app
    restart: always
    volumes:
      - .:/app
    networks:
      - portfolio-network
    depends_on:
      - postgres

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: portfolio-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/app
    networks:
      - portfolio-network
    depends_on:
      - app

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: portfolio-postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-portfolio:/var/lib/postgresql/data
    networks:
      - portfolio-network

  vite:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    container_name: portfolio_vite
    restart: always
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - portfolio-network



networks:
  portfolio-network:

volumes:
  postgres-data-portfolio:
