services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: portfolio-app
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - portfolio-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: portfolio-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/app
    networks:
      - portfolio-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: portfolio-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-portfolio}
      POSTGRES_USER: ${DB_USERNAME:-portfolio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-portfolio:/var/lib/postgresql/data
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-portfolio} -d ${DB_DATABASE:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vite:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    container_name: portfolio_vite
    restart: always
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - portfolio-network



networks:
  portfolio-network:

volumes:
  postgres-data-portfolio:
